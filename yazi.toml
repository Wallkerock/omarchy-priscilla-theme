  { name = "gif", text = " ", fg = "#ffcd77" }, # foreground
  { name = "jpg", text = " ", fg = "#ffcd77" }, # foreground
  { name = "jpeg", text = " ", fg = "#ffcd77" }, # foreground
  { name = "png", text = " ", fg = "#ffcd77" }, # foreground
  { name = "jxl", text = " ", fg = "#ffcd77" }, # foreground
  { name = "odt", text = " ", fg = "#4CE0A3" }, # foreground
  { name = "toml", text = " ", fg = "#449694" }, # cursor
