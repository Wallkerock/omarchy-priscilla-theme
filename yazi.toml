conds = [
	{ if = "orphan", text = " ", fg = "#9a9078" }, # selection_background
	{ if = "link", text = " ", fg = "#9a9078" }, # selection_background
	{ if = "block", text = " ", fg = "#91760d" }, # cursor
	{ if = "char", text = " ", fg = "#91760d" }, # cursor
	{ if = "fifo", text = " ", fg = "#91760d" }, # cursor
	{ if = "sock", text = " ", fg = "#91760d" }, # cursor
	{ if = "sticky", text = " ", fg = "#91760d" }, # cursor
