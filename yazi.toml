  { name = "srt", text = "󰨖 ", fg = "#74B5B5" }, # foreground
  { name = "vtt", text = "󰨖 ", fg = "#74B5B5" }, # foreground
  { name = "sub", text = "󰨖 ", fg = "#74B5B5" }, # foreground
  { name = "iso", text = " ", fg = "#ae6663" }, # foreground
